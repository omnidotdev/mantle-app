query AllCompanies($organizationId: String!) {
  allCompanies(condition: { organizationId: $organizationId }) {
    nodes {
      id
      organizationId
      name
      website
      industry
      phone
      email
      addressLine_1
      addressLine_2
      city
      state
      postalCode
      country
      notes
      createdAt
      updatedAt
    }
  }
}

mutation CreateCompany($input: CreateCompanyInput!) {
  createCompany(input: $input) {
    company {
      id
      name
    }
  }
}

mutation UpdateCompany($id: UUID!, $patch: CompanyPatch!) {
  updateCompanyById(input: { id: $id, companyPatch: $patch }) {
    company {
      id
      name
    }
  }
}

mutation DeleteCompany($id: UUID!) {
  deleteCompanyById(input: { id: $id }) {
    deletedCompanyId
  }
}
