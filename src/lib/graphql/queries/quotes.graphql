query AllQuotes($organizationId: String!) {
  quotes(condition: { organizationId: $organizationId }) {
    nodes {
      rowId
      organizationId
      quoteNumber
      companyId
      contactId
      title
      description
      status
      validUntil
      terms
      notes
      subtotal
      taxRate
      taxAmount
      total
      currency
      convertedInvoiceId
      createdAt
      updatedAt
      company {
        rowId
        name
      }
      contact {
        rowId
        firstName
        lastName
      }
      quoteLineItems {
        nodes {
          rowId
          quoteId
          productId
          description
          quantity
          unitPrice
          amount
          pricingType
          estimatedHours
          royaltyPercentage
          sortOrder
        }
      }
    }
  }
}

mutation CreateQuote($input: CreateQuoteInput!) {
  createQuote(input: $input) {
    quote {
      rowId
      quoteNumber
    }
  }
}

mutation UpdateQuote($input: UpdateQuoteInput!) {
  updateQuote(input: $input) {
    quote {
      rowId
      quoteNumber
    }
  }
}

mutation DeleteQuote($input: DeleteQuoteInput!) {
  deleteQuote(input: $input) {
    deletedQuoteId
  }
}
