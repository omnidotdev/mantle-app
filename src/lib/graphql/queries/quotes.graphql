query AllQuotes($organizationId: String!) {
  quotes(condition: { organizationId: $organizationId }) {
    nodes {
      rowId
      organizationId
      quoteNumber
      companyId
      contactId
      clientName
      clientEmail
      additionalItemsLabel
      title
      description
      status
      validUntil
      projectType
      timeRange
      terms
      additionalTerms
      notes
      subtotal
      taxRate
      taxAmount
      total
      currency
      convertedInvoiceId
      createdAt
      updatedAt
      company {
        rowId
        name
      }
      contact {
        rowId
        firstName
        lastName
      }
      quoteLineItems(orderBy: [SORT_ORDER_ASC]) {
        nodes {
          rowId
          quoteId
          productId
          description
          subtitle
          quantity
          unitPrice
          amount
          pricingType
          estimatedHours
          hourlyRate
          weeklyCapHours
          monthlyCapHours
          maxCapHours
          minimumBillingMinutes
          royaltyPercentage
          royaltyTimeframe
          royaltyTimeframeUnit
          royaltyThreshold
          royaltyBuyoutAmount
          sortOrder
          deliverables
          acceptanceCriteria
        }
      }
    }
  }
}

mutation CreateQuote($input: CreateQuoteInput!) {
  createQuote(input: $input) {
    quote {
      rowId
      quoteNumber
    }
  }
}

mutation UpdateQuote($input: UpdateQuoteInput!) {
  updateQuote(input: $input) {
    quote {
      rowId
      quoteNumber
    }
  }
}

mutation DeleteQuote($input: DeleteQuoteInput!) {
  deleteQuote(input: $input) {
    deletedQuoteId
  }
}

mutation CreateQuoteLineItem($input: CreateQuoteLineItemInput!) {
  createQuoteLineItem(input: $input) {
    quoteLineItem {
      rowId
    }
  }
}

mutation DeleteQuoteLineItem($input: DeleteQuoteLineItemInput!) {
  deleteQuoteLineItem(input: $input) {
    deletedQuoteLineItemId
  }
}
