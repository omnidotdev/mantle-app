query AllInvoices($organizationId: String!) {
  invoices(condition: { organizationId: $organizationId }) {
    nodes {
      rowId
      organizationId
      invoiceNumber
      companyId
      contactId
      billTo
      status
      issueDate
      dueDate
      notes
      subtotal
      taxRate
      taxAmount
      total
      currency
      paidAt
      paymentReference
      paymentLinkUrl
      createdAt
      updatedAt
      company {
        rowId
        name
      }
      contact {
        rowId
        firstName
        lastName
      }
      invoiceLineItems {
        nodes {
          rowId
          invoiceId
          productId
          description
          quantity
          unitPrice
          amount
          sortOrder
        }
      }
    }
  }
}

mutation CreateInvoice($input: CreateInvoiceInput!) {
  createInvoice(input: $input) {
    invoice {
      rowId
      invoiceNumber
    }
  }
}

mutation UpdateInvoice($input: UpdateInvoiceInput!) {
  updateInvoice(input: $input) {
    invoice {
      rowId
      invoiceNumber
    }
  }
}

mutation DeleteInvoice($input: DeleteInvoiceInput!) {
  deleteInvoice(input: $input) {
    deletedInvoiceId
  }
}

mutation CreateInvoiceLineItem($input: CreateInvoiceLineItemInput!) {
  createInvoiceLineItem(input: $input) {
    invoiceLineItem {
      rowId
    }
  }
}

mutation DeleteInvoiceLineItem($input: DeleteInvoiceLineItemInput!) {
  deleteInvoiceLineItem(input: $input) {
    deletedInvoiceLineItemId
  }
}
